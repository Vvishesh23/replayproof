[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replayproof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.8,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["replayproof*"]

[tool.setuptools.package-data]
replayproof = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
