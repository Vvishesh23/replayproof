name: replayproof
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: localonly
      POSTGRES_DB: replay
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://replay:localonly@db:5432/replay
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://replay:localonly@db:5432/replay
      REPLAYPROOF_DEV_REBUILD: ${REPLAYPROOF_DEV_REBUILD:-0}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
