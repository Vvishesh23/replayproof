name: correctness
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: localonly
          POSTGRES_DB: replay
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://replay:localonly@localhost:5432/replay
      REPLAYPROOF_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: mypy replayproof
      - run: alembic upgrade head
      - run: pytest -q
